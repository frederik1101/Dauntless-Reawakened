name: Backend contract and TLS tests
on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install TLS test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline contract, persistence, HTTP and TLS tests
        run: python -m unittest discover -s tests -v
