name: Python prototype tests
on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run contract and persistence tests
        run: python -m unittest discover -s tests -v
